services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage (SeaweedFS replaces discontinued minio/minio Docker Hub images)
  # Runs master + volume + filer + S3 gateway in one process.
  # -s3.autoCreateBucket: bucket created on first PUT without extra init container.
  # Access key / secret set via s3.config JSON mounted from scripts/.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server
      -dir=/data
      -filer
      -s3
      -s3.port=9000
      -s3.config=/etc/seaweedfs/s3.json
      -s3.autoCreateBucket=true
    volumes:
      - seaweedfs_data:/data
      - ./scripts/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - '9000:9000'   # S3 API
      - '9001:8888'   # Filer UI (optional)
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/ 2>&1 | grep -qiE "method not allowed|xml|NoSuchBucket|<!DOCTYPE" || exit 0']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 5s
      timeout: 3s
      retries: 5

  # Detector built locally once training is complete (Phase 4 / TASK-035).
  # Commented out until services/detector/Dockerfile and trained artifact exist.
  # detector:
  #   build:
  #     context: ./services/detector
  #     dockerfile: Dockerfile
  #   environment:
  #     DETECTOR_API_KEY: test-detector-key
  #     PORT: 8001
  #   ports:
  #     - '8001:8001'
  #   healthcheck:
  #     test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8001/healthz']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

volumes:
  postgres_data:
  seaweedfs_data:
