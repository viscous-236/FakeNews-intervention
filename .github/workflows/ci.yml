name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  # --------------------------------------------------------------------------
  lint-typecheck:
    # --------------------------------------------------------------------------
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # --------------------------------------------------------------------------
  api-tests:
    # --------------------------------------------------------------------------
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      DETECTOR_URL: http://localhost:8001
      DETECTOR_API_KEY: test-detector-key
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: app-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9000/app-media
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      EMAIL_FROM: noreply@localhost
      METRICS_TOKEN: test-metrics-token
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Create app_test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE app_test;" || true

      - name: Start S3 storage using the development Compose service
        run: |
          docker compose up -d seaweedfs
          node --input-type=module <<'JS'
          import { S3Client, ListBucketsCommand } from '@aws-sdk/client-s3';
          import { setTimeout } from 'node:timers/promises';
          const client = new S3Client({ endpoint: process.env.S3_ENDPOINT,
            region: process.env.S3_REGION, forcePathStyle: true, maxAttempts: 1,
            credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID,
              secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } });
          for (let attempt = 0; attempt < 30; attempt++) {
            try { await client.send(new ListBucketsCommand({})); client.destroy(); process.exit(0); }
            catch (error) { if (attempt === 29) throw error; await setTimeout(2000); }
          }
          JS

      - name: Build detector image
        run: docker build --tag fakenews-detector:ci services/detector

      - name: Start detector
        run: |
          docker run --detach --name fakenews-detector --network host \
            --env DETECTOR_API_KEY=test-detector-key \
            --env PORT=8001 fakenews-detector:ci
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8001/healthz && exit 0
            sleep 5
          done
          docker logs fakenews-detector
          exit 1

      - name: Run API tests
        env:
          REAL_DETECTOR_CONTAINER: fakenews-detector
        run: npm run test -w apps/api

  # --------------------------------------------------------------------------
  web-tests:
    # --------------------------------------------------------------------------
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test -w apps/web

  # --------------------------------------------------------------------------
  detector-tests:
    # Real detector contract and inference tests.
    # --------------------------------------------------------------------------
    name: Detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install detector dependencies
        working-directory: services/detector
        run: python -m pip install --upgrade pip && pip install -r requirements-train.txt

      - name: Download detector model
        working-directory: services/detector
        env:
          DETECTOR_API_KEY: test-detector-key
        run: python scripts/download_model.py

      - name: Run detector tests
        working-directory: services/detector
        run: pytest -q

      - name: Ruff
        working-directory: services/detector
        run: ruff check .

      - name: Mypy
        working-directory: services/detector
        run: mypy app

  # --------------------------------------------------------------------------
  audit:
    # --------------------------------------------------------------------------
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: pip-audit
        working-directory: services/detector
        run: pip-audit -r requirements.txt
